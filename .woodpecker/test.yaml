when:
  - event: pull_request
  - event: push
    branch: renovate/*

variables:
  - &golang 'golang:1.27-alpine'

steps:
  lint:
    image: *golang
    depends_on: []
    commands:
      - go vet ./...
      - unformatted=$(go run mvdan.cc/gofumpt@v0.12.0 -extra -l .)
      - 'if [ -n "$unformatted" ]; then echo "error: files not formatted with gofumpt -extra:"; echo "$unformatted"; echo "fix with: go run mvdan.cc/gofumpt@v0.12.0 -extra -w ."; exit 1; fi'

  test:
    image: *golang
    depends_on: []
    commands:
      - go test -cover ./...
