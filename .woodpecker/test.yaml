when:
  - event: pull_request
  - event: push
    branch: renovate/*

variables:
  - &golang 'golang:1.27-alpine'

steps:
  lint:
    image: *golang
    depends_on: []
    commands:
      - go vet ./...
      - test -z "$(go run mvdan.cc/gofumpt@v0.12.0 -extra -l .)" || echo 'error: format files with gofumpt'

  test:
    image: *golang
    depends_on: []
    commands:
      - go test -cover ./...
