when:
  - event: pull_request
  - event: push
    branch: renovate/*

variables:
  - &golang 'golang:1.27-alpine'

steps:
  lint:
    image: golangci/golangci-lint:v2.15.0
    depends_on: []
    commands:
      - golangci-lint run

  test:
    image: *golang
    depends_on: []
    commands:
      - go test -cover ./...
