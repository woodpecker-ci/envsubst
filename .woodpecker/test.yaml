when:
  - event: pull_request
  - event: push
    branch: renovate/*

variables:
  - &golang 'golang:1.27-alpine'

steps:
  lint:
    image: *golang
    depends_on: []
    commands:
      - go vet ./...
      - test -z "$(gofmt -l . | tee /dev/stderr)"

  test:
    image: *golang
    depends_on: []
    commands:
      - go test -cover ./...
